[Service]
# SigmaTCP :8086 must stay enabled (Beocreate 2 uses it), so the package default
# "--localhost --disable-tcp" is replaced. --alsa creates the "DSPVolume" control.
#
# Deliberately NOT --store/--restore (package default since 1.3.11): --restore
# re-applies the whole DSP data memory at boot, including the volume register
# 106, so the box would boot at the last used volume instead of the safe stored
# DSPVolume. Beocreate 2 re-applies its own settings (EQ, channels) on connect.
ExecStart=
ExecStart=sigmatcpserver --alsa --enable-rest

# sigmatcpserver does not exit on the package's KillSignal=SIGINT (observed with
# 1.3.12: every stop ran into the timeout and ended in SIGKILL). The graceful
# path only matters for --store, which is not used, so don't wait 15 s for it.
TimeoutStopSec=5

# Loopback only. Neither --localhost nor --bind-address fits: Beocreate 2
# (beocreate_essentials/dsp.js) connects to 127.0.1.1:8086, dsptoolkit to
# 127.0.0.1:8086, and one bind address can serve only one of them. The servers
# therefore keep listening on 0.0.0.0, and systemd drops all non-loopback
# traffic of this unit. Without this, SigmaTCP and the unauthenticated REST API
# (register writes, POST /dspprofile) are open to the whole LAN.
IPAddressAllow=localhost
IPAddressDeny=any
